name: Lint and Test
on:
  push:
    branches-ignore:
      [main]

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2
        with:
          fetch-depth: 0

      - name: Install Exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install poetry dependency manager
        run: pipx install poetry==2.1.2

      - name: Setup Python environment
        uses: actions/setup-python@v4.7.1
        with:
          cache: poetry

      - name: Enforce style guides and lint rules
        uses: pre-commit/action@646c83fcd040023954eafda54b4db0192ce70507 # v3.0.0

      - name: Install dependencies
        run: poetry install

      - name: Run unit tests
        run: poetry run pytest

      - name: Confirm repo is clean
        run: git diff-index --quiet HEAD
