name: imgcorrect-venv
channels:
  - conda-forge
channel_priority: strict
dependencies:
  - "python>=3.10,<4.0"
  # dev dependencies
  - "pytest>=8.4.0,<10.0"
  - "pre-commit>=4.3.0,<5.0"
  - sphinx=7.0.0
  - sphinx-rtd-theme=2.0.0
  - m2r=0.3.1
  - pip=24.0
  - pipenv=2026.0.3
  # main dependencies
  - "pillow>=9.0.1"
  - "numpy>=2.0,<3.0"
  - "tifffile>=2025.5.10,<2027.0.0"
  - "pandas>=2.3.0,<4.0"
  - "tqdm>=4.59.0,<5.0.0"
  - "imageio>=2.19.3,<3.0.0"
  - "imagecodecs>=2025.3.30,<2027.0.0"
  - "urllib3<2"
  - pip:
    - "opencv-python-headless>=4.13.0,<5.0"
    - "imgparse @ git+https://github.com/SenteraLLC/py-image-metadata-parser.git@v2.0.14"
