repos:
- repo: https://github.com/pycqa/isort
  rev: 6.0.1
  hooks:
    - id: isort
      args: ["--profile", "black"]
- repo: https://github.com/ambv/black
  rev: 25.9.0
  hooks:
    - id: black
- repo: https://github.com/pycqa/flake8
  rev: '7.3.0'
  hooks:
    - id: flake8
      exclude: (test|doc|scripts)
      additional_dependencies: [
          'flake8-docstrings',
          'flake8-builtins',
          'flake8-logging',
          'flake8-rst-docstrings',
          'pygments',
          'pep8-naming'
      ]